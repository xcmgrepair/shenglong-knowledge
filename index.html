      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input type="email" class="form-input" id="loginEmail" placeholder="请输入邮箱">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码">
      </div>
      <div style="text-align:right;margin-bottom:16px">
        <a href="javascript:void(0)" onclick="showRegister()" style="font-size:13px;color:var(--primary)">没有账号？去注册</a>
      </div>
      <button class="btn btn-primary btn-block" onclick="doLogin()">登录</button>
    </div>
  </div>
</div>

<!-- 注册弹窗 -->
<div id="registerModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)hideRegister()">
  <div class="modal">
    <div class="modal-header">注册</div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input type="email" class="form-input" id="regEmail" placeholder="请输入邮箱">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" id="regPassword" placeholder="至少6位">
      </div>
      <div class="form-group">
        <label class="form-label">姓名</label>
        <input type="text" class="form-input" id="regName" placeholder="请输入您的姓名">
      </div>
      <div style="text-align:right;margin-bottom:16px">
        <a href="javascript:void(0)" onclick="showLogin()" style="font-size:13px;color:var(--primary)">已有账号？去登录</a>
      </div>
      <button class="btn btn-primary btn-block" onclick="doRegister()">注册</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" style="display:none"></div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/sb-js@2"></script>
<script>
// ==================== 配置管理 ====================
let sb = null;

function getConfig() {
  try {
    const saved = localStorage.getItem('shenglong_config');
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  return { url: "https://doeterhmcgczxmyoybmv.supabase.co", key: "sb_secret_mf2sDfm3WMRK88M_b5BXPQ_q3_C29IK" };
}

function saveConfig() {
  const url = document.getElementById('setupUrl').value.trim();
  const key = document.getElementById('setupKey').value.trim();
  
  if (!url || !key) {
    showToast('请填写完整的配置信息');
    return;
  }
  
  localStorage.setItem('shenglong_config', JSON.stringify({ url, key }));
  initSupabase();
  showToast('配置保存成功');
  showPage('homePage');
  loadManuals();
}

function initSupabase() {
  const config = getConfig();
  if (config.url && config.key) {
    sb = window.supabase.createClient(config.url, config.key);
    return true;
  }
  return false;
}

// ==================== 页面导航 ====================
const pageHistory = [];

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  window.scrollTo(0, 0);
}

function goBack() {
  if (pageHistory.length > 0) {
    const prev = pageHistory.pop();
    showPage(prev.page);
    if (prev.data) {
      if (prev.page === 'categoryPage') loadCategories(prev.data.manualId, prev.data.parentId, prev.data.title);
      else if (prev.page === 'knowledgePage') loadKnowledgeList(prev.data.catId, prev.data.title);
      else if (prev.page === 'detailPage') loadKnowledgeDetail(prev.data.id);
    }
  } else {
    showPage('homePage');
  }
}

function navigateTo(page, data) {
  const currentPage = document.querySelector('.page.active');
  if (currentPage) {
    pageHistory.push({ page: currentPage.id, data: null });
  }
  showPage(page);
  if (data) {
    if (page === 'categoryPage') loadCategories(data.manualId, data.parentId, data.title);
    else if (page === 'knowledgePage') loadKnowledgeList(data.catId, data.title);
    else if (page === 'detailPage') loadKnowledgeDetail(data.id);
  }
}

// ==================== 工具函数 ====================
function showToast(msg, duration = 2000) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, duration);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 简单的 Markdown 解析
function parseMarkdown(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  
  // 标题
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  
  // 粗体
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  
  // 列表
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  
  // 有序列表
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  
  // 段落
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  
  // 清理多余的标签
  html = html.replace(/<p><h/g, '<h');
  html = html.replace(/<\/h\d><\/p>/g, match => match.replace('</p>', ''));
  html = html.replace(/<p><ul>/g, '<ul>');
  html = html.replace(/<\/ul><\/p>/g, '</ul>');
  
  return html;
}

// ==================== 数据加载 ====================
async function loadManuals() {
  if (!sb) return;
  
  try {
    const { data, error } = await sb
      .from('manuals')
      .select('*')
      .eq('status', 'active')
      .order('sort_order');
    
    if (error) throw error;
    
    const grid = document.getElementById('manualGrid');
    document.getElementById('statManuals').textContent = data.length;
    
    if (data.length === 0) {
      grid.innerHTML = '<div class="empty"><div class="empty-icon">📚</div><div class="empty-text">暂无手册</div></div>';
      return;
    }
    
    grid.innerHTML = data.map(m => `
      <div class="manual-card" onclick="navigateTo('categoryPage', {manualId: '${m.id}', title: '${escapeHtml(m.name)}'})">
        <div class="manual-count">${m.sort_order || 0}</div>
        <div class="manual-icon" style="background:${m.primary_color}15;color:${m.primary_color}">${m.icon || '📖'}</div>
        <div class="manual-name">${escapeHtml(m.name)}</div>
        <div class="manual-desc">${escapeHtml(m.description || '')}</div>
      </div>
    `).join('');
    
    // 加载知识点总数
    const { count } = await sb
      .from('knowledge')
      .select('*', { count: 'exact', head: true })
      .eq('status', 'published');
    document.getElementById('statKnowledge').textContent = count || 0;
    
  } catch (err) {
    console.error('加载手册失败:', err);
    showToast('加载失败，请检查网络');
  }
}

let currentManualId = null;
let currentParentId = null;

async function loadCategories(manualId, parentId, title) {
  if (!sb) return;
  
  currentManualId = manualId;
  currentParentId = parentId;
  document.getElementById('categoryPageTitle').textContent = title || '分类';
  
  try {
    let query = sb
      .from('categories')
      .select('*')
      .eq('manual_id', manualId)
      .eq('status', 'active');
    
    if (parentId) {
      query = query.eq('parent_id', parentId);
    } else {
      query = query.is('parent_id', null);
    }
    
    const { data, error } = await query.order('sort_order');
    if (error) throw error;
    
    const list = document.getElementById('categoryList');
    
    // 更新面包屑
    await updateBreadcrumb(manualId, parentId);
    
    if (data.length === 0) {
      // 如果没有子分类，直接显示知识点
      const { data: catData } = await sb
        .from('categories')
        .select('id, name')
        .eq('id', parentId)
        .single();
      
      if (catData) {
        navigateTo('knowledgePage', { catId: parentId, title: catData.name });
        pageHistory.pop(); // 移除多余的历史
        return;
      }
      
      list.innerHTML = '<div class="empty"><div class="empty-icon">📂</div><div class="empty-text">暂无分类</div></div>';
      return;
    }
    
    list.innerHTML = data.map(c => `
      <div class="cat-item" onclick="handleCategoryClick('${c.id}', '${escapeHtml(c.name)}')">
        <div class="cat-item-left">
          <div class="cat-icon">📁</div>
          <div class="cat-info">
            <div class="cat-name">${escapeHtml(c.name)}</div>
            <div class="cat-desc">${escapeHtml(c.description || '点击查看详情')}</div>
          </div>
        </div>
        <div class="cat-arrow">›</div>
      </div>
    `).join('');
    
  } catch (err) {
    console.error('加载分类失败:', err);
    showToast('加载失败');
  }
}

async function handleCategoryClick(catId, catName) {
  // 先检查是否有子分类
  const { count } = await sb
    .from('categories')
    .select('*', { count: 'exact', head: true })
    .eq('parent_id', catId)
    .eq('status', 'active');
  
  if (count > 0) {
    // 有子分类，继续显示分类列表
    pageHistory.push({ page: 'categoryPage', data: { manualId: currentManualId, parentId: currentParentId, title: document.getElementById('categoryPageTitle').textContent } });
    loadCategories(currentManualId, catId, catName);
  } else {
    // 没有子分类，显示知识点列表
    navigateTo('knowledgePage', { catId, title: catName });
  }
}

async function updateBreadcrumb(manualId, parentId) {
  const breadcrumb = document.getElementById('breadcrumb');
  let html = '<span class="breadcrumb-item" onclick="showPage(\'homePage\');pageHistory.length=0">首页</span>';
  
  // 获取手册名称
  const { data: manual } = await sb
    .from('manuals')
    .select('name')
    .eq('id', manualId)
    .single();
  
  if (manual) {
    html += `<span class="breadcrumb-sep">/</span><span class="breadcrumb-item" onclick="navigateTo('categoryPage', {manualId: '${manualId}', title: '${escapeHtml(manual.name)}'})">${escapeHtml(manual.name)}</span>`;
  }
  
  // 如果有父分类，获取父级链
  if (parentId) {
    const parents = [];
    let currentId = parentId;
    
    while (currentId) {
      const { data: cat } = await sb
        .from('categories')
        .select('id, name, parent_id')
        .eq('id', currentId)
        .single();
      
      if (cat) {
        parents.unshift(cat);
        currentId = cat.parent_id;
      } else {
        break;
      }
    }
    
    parents.forEach((p, i) => {
      const isLast = i === parents.length - 1;
      html += `<span class="breadcrumb-sep">/</span><span class="breadcrumb-item ${isLast ? 'active' : ''}" ${isLast ? '' : `onclick="loadCategories('${manualId}', '${p.id}', '${escapeHtml(p.name)}')"`}>${escapeHtml(p.name)}</span>`;
    });
  }
  
  breadcrumb.innerHTML = html;
}

async function loadKnowledgeList(catId, title) {
  if (!sb) return;
  
  document.getElementById('knowledgePageTitle').textContent = title || '知识点';
  
  // 加载投稿分类选项
  loadSubmissionCategories();
  
  try {
    const { data, error } = await sb
      .from('knowledge')
      .select('*')
      .eq('category_id', catId)
      .eq('status', 'published')
      .order('sort_order');
    
    if (error) throw error;
    
    const list = document.getElementById('knowledgeList');
    
    if (data.length === 0) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">📝</div><div class="empty-text">暂无知识点</div><div class="empty-desc">点击右下角按钮提交知识点</div></div>';
      return;
    }
    
    list.innerHTML = data.map(k => `
      <div class="knowledge-item" onclick="navigateTo('detailPage', {id: '${k.id}'})">
        <div class="knowledge-title">${escapeHtml(k.title)}</div>
        <div class="knowledge-desc">${escapeHtml(k.description || k.content.substring(0, 100))}</div>
        <div class="knowledge-meta">
          <span>👁 ${k.views || 0} 次浏览</span>
          ${k.submitter ? `<span>✍️ ${escapeHtml(k.submitter)}</span>` : ''}
        </div>
      </div>
    `).join('');
    
  } catch (err) {
    console.error('加载知识点失败:', err);
    showToast('加载失败');
  }
}

async function loadKnowledgeDetail(id) {
  if (!sb) return;
  
  try {
    // 增加浏览量
    const { data: current } = await sb
      .from('knowledge')
      .select('views')
      .eq('id', id)
      .single();
    
    await sb
      .from('knowledge')
      .update({ views: (current?.views || 0) + 1 })
      .eq('id', id);
    
    // 获取详情
    const { data, error } = await sb
      .from('knowledge')
      .select('*')
      .eq('id', id)
      .single();
    
    if (error) throw error;
    
    const content = document.getElementById('detailContent');
    content.innerHTML = `
      <h1 class="kb-detail-title">${escapeHtml(data.title)}</h1>
      <div class="kb-detail-meta">
        <span>👁 ${data.views || 0} 次浏览</span>
        ${data.submitter ? `<span>✍️ ${escapeHtml(data.submitter)}</span>` : ''}
        <span>📅 ${new Date(data.created_at).toLocaleDateString('zh-CN')}</span>
      </div>
      <div class="kb-detail-content">${parseMarkdown(data.content)}</div>
    `;
    
  } catch (err) {
    console.error('加载详情失败:', err);
    document.getElementById('detailContent').innerHTML = 
      '<div class="empty"><div class="empty-icon">❌</div><div class="empty-text">加载失败</div></div>';
  }
}

// ==================== 投稿功能 ====================
async function loadSubmissionCategories() {
  if (!sb) return;
  
  try {
    const { data, error } = await sb
      .from('categories')
      .select('id, name, manual_id')
      .eq('status', 'active')
      .order('name');
    
    if (error) throw error;
    
    const select = document.getElementById('subCategory');
    select.innerHTML = '<option value="">请选择分类</option>' + 
      data.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    
  } catch (err) {
    console.error('加载分类失败:', err);
  }
}

function showSubmission() {
  if (!sb) {
    showToast('请先配置 Supabase');
    return;
  }
  loadSubmissionCategories();
  navigateTo('submissionPage', null);
}

async function submitKnowledge() {
  const category_id = document.getElementById('subCategory').value;
  const title = document.getElementById('subTitle').value.trim();
  const description = document.getElementById('subDesc').value.trim();
  const content = document.getElementById('subContent').value.trim();
  const submitter_name = document.getElementById('subName').value.trim() || '匿名';
  const submitter_contact = document.getElementById('subContact').value.trim();
  
  if (!category_id) { showToast('请选择分类'); return; }
  if (!title) { showToast('请输入标题'); return; }
  if (!content) { showToast('请输入内容'); return; }
  
  try {
    const { error } = await sb
      .from('submissions')
      .insert({
        title,
        content,
        description,
        category_id,
        submitter_name,
        submitter_contact,
        status: 'pending'
      });
    
    if (error) throw error;
    
    showToast('提交成功，等待审核');
    
    // 清空表单
    document.getElementById('subTitle').value = '';
    document.getElementById('subDesc').value = '';
    document.getElementById('subContent').value = '';
    document.getElementById('subName').value = '';
    document.getElementById('subContact').value = '';
    
    setTimeout(() => goBack(), 1500);
    
  } catch (err) {
    console.error('提交失败:', err);
    showToast('提交失败，请重试');
  }
}

// ==================== 用户认证 ====================
function showLogin() {
  document.getElementById('loginModal').style.display = 'flex';
}

function hideLogin() {
  document.getElementById('loginModal').style.display = 'none';
}

function showRegister() {
  hideLogin();
  document.getElementById('registerModal').style.display = 'flex';
}

function hideRegister() {
  document.getElementById('registerModal').style.display = 'none';
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  
  if (!email || !password) {
    showToast('请输入邮箱和密码');
    return;
  }
  
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    
    showToast('登录成功');
    hideLogin();
    
    // 检查是否是管理员
    const { data: profile } = await sb
      .from('profiles')
      .select('role')
      .eq('id', data.user.id)
      .single();
    
    if (profile?.role === 'admin' || profile?.role === 'manager') {
      // 跳转到管理后台
      window.location.href = 'admin.html';
    }
    
    updateUserUI();
    
  } catch (err) {
    console.error('登录失败:', err);
    showToast(err.message || '登录失败');
  }
}

async function doRegister() {
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const name = document.getElementById('regName').value.trim();
  
  if (!email || !password || !name) {
    showToast('请填写完整信息');
    return;
  }
  
  if (password.length < 6) {
    showToast('密码至少6位');
    return;
  }
  
  try {
    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: {
        data: { name }
      }
    });
    
    if (error) throw error;
    
    showToast('注册成功，请检查邮箱验证');
    hideRegister();
    
  } catch (err) {
    console.error('注册失败:', err);
    showToast(err.message || '注册失败');
  }
}

async function updateUserUI() {
  const { data: { user } } = await sb.auth.getUser();
  const rightBtn = document.querySelector('.app-header .right-btn');
  
  if (user) {
    const { data: profile } = await sb
      .from('profiles')
      .select('name, role')
      .eq('id', user.id)
      .single();
    
    rightBtn.textContent = profile?.name || user.email;
    rightBtn.onclick = () => {
      if (confirm('确定要退出登录吗？')) {
        sb.auth.signOut();
        updateUserUI();
        showToast('已退出登录');
      }
    };
  } else {
    rightBtn.textContent = '登录';
    rightBtn.onclick = showLogin;
  }
}

// ==================== 初始化 ====================
window.onload = function() {
  if (initSupabase()) {
    showPage('homePage');
    loadManuals();
    updateUserUI();
    
    // 监听认证状态变化
    sb.auth.onAuthStateChange(() => {
      updateUserUI();
    });
  } else {
    showPage('setupPage');
  }
};
</script>
